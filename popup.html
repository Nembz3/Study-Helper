<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Helper</title><link rel="stylesheet" href="popup.css"></head><body><main><header><h1>📚 Study Helper <span>V3.2</span></h1><p>Rapid Assist · token-saving AI study help</p></header><label class="toggle"><input id="rapidAutoAnalyse" type="checkbox"> Rapid Mode: automatically analyse each new question once</label><textarea id="question" placeholder="Select a question on a webpage, right-click it, or paste it here..."></textarea><div class="actions"><button data-mode="hint">💡 Hint</button><button data-mode="explain">🧠 Explain</button><button data-mode="answer">⚡ Quick Answer</button></div><div id="status"></div><section id="result" hidden><div id="provider"></div><pre id="response"></pre><button id="copyAnswer">Copy answer</button></section><details><summary>⚙️ AI Providers & Settings</summary><div class="setting"><h3>1. Groq — Primary</h3><input id="groqKey" type="password" placeholder="Groq API key"><input id="groqModel" value="openai/gpt-oss-20b"></div><div class="setting"><h3>2. Gemini — Backup</h3><input id="geminiKey" type="password" placeholder="Gemini API key"><input id="geminiModel" value="gemini-2.0-flash"></div><div class="setting"><h3>3. OpenRouter — Backup</h3><input id="openrouterKey" type="password" placeholder="OpenRouter API key"><input id="openrouterModel" value="google/gemma-3-27b-it:free"></div><button id="save">Save API Settings</button><p class="note">Short prompts, 180-token response cap and per-session caching reduce usage.</p></details><section class="history"><h3>Recent questions</h3><div id="history"></div></section></main><script src="popup.js"></script></body></html>
